name: ClawHub

on:
  pull_request:
  workflow_dispatch:

jobs:
  preview:
    if: github.event_name == 'pull_request'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v1
    with:
      skill_path: ./skill
      owner: dokki-lab
      dry_run: true
  publish:
    if: github.event_name == 'workflow_dispatch'
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v1
    with:
      skill_path: ./skill
      owner: dokki-lab
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
